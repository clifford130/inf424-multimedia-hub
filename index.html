<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduStream Learning Hub</title>
    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
        <div class="logo">EduStream Learning Hub</div>
        <div class="student-info">
            <p><strong>Full Name:</strong> CLIFFORD ISABOKE ONCHOMBA</p>
            <p><strong>Student Number:</strong> INF/003/2022</p>
            <p><strong>Course Code:</strong> INF 424</p>
        </div>
    </header>

    <main>
        <section class="hero-section">
            <h1>Welcome to EduStream Learning Hub</h1>
            <p>Empowering learners with modern educational tools and resources.</p>
            <picture>
                <source srcset="assets/images/hero.avif" type="image/avif">
                <source srcset="assets/images/hero.webp" type="image/webp">
                <img src="assets/images/hero.jpg" alt="Students collaborating in a modern learning environment with digital devices" width="800" height="600" class="hero-image">
            </picture>
        </section>

        <section class="illustration-section">
            <svg class="illustration" viewBox="0 0 400 300" role="img" aria-label="Educational illustration showing learning dashboard with books, computer, and growth chart">
                <!-- Background rectangle -->
                <rect width="400" height="300" fill="#e8f4f8"/>
                <!-- Book -->
                <rect x="50" y="100" width="60" height="40" fill="#4a90e2" rx="5"/>
                <rect x="55" y="110" width="50" height="3" fill="#fff"/>
                <rect x="55" y="118" width="35" height="3" fill="#fff"/>
                <!-- Computer screen -->
                <rect x="150" y="80" width="80" height="60" fill="#333" rx="5"/>
                <rect x="160" y="90" width="60" height="40" fill="#1e90ff"/>
                <!-- Growth chart -->
                <line x1="280" y1="200" x2="280" y2="120" stroke="#333" stroke-width="3"/>
                <line x1="280" y1="200" x2="350" y2="200" stroke="#333" stroke-width="3"/>
                <polygon points="285,180 295,170 305,180" fill="#4caf50"/>
                <polygon points="310,160 320,150 330,160" fill="#4caf50"/>
                <polygon points="335,140 345,130 355,140" fill="#4caf50"/>
                <!-- Text -->
                <text x="200" y="250" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" fill="#333">Learning Dashboard</text>
            </svg>
        </section>
    </main>
</body>
</html>
