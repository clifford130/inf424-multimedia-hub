<!-- Navigation Bar -->

  <main>
    <div class="gallery-container">
      <h1 class="gallery-title">📚 Learning Resource Library</h1>
      
      <!-- Live search input -->
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Filter by title..." aria-label="Search media by title">
      </div>

      <!-- Dynamic gallery grid -->
      <div id="galleryGrid" class="gallery-grid"></div>
    </div>
  </main>

  <footer class="page-footer">
    <p>CLIFFORD ISABOKE ONCHOMBA | INF 424 </p>
  </footer>

  <script>
    // ---------- MEDIA LIBRARY DATA ARRAY ----------
    const mediaLibrary = [
      // Videos
      { id: 1, title: "Convert Python to Executable", type: "video", thumbnail: "assets/video/poster.jpg", duration: "15:42", description: "Learn how to convert Python scripts to standalone executables." },
      { id: 2, title: "JavaScript Tutorial", type: "video", thumbnail: "assets/video/poster.jpg", duration: "12:34", description: "Introduction to JavaScript programming." },
      { id: 3, title: "Kelly Programming", type: "video", thumbnail: "assets/video/poster.jpg", duration: "18:22", description: "Programming tutorial with Kelly." },
      { id: 4, title: "Raddy Programming", type: "video", thumbnail: "assets/video/poster.jpg", duration: "24:08", description: "Advanced programming concepts." },
      
      // Audio
      { id: 5, title: "AI Warning Message", type: "audio", thumbnail: "assets/images/hero.png", duration: "00:15", description: "Warning about artificial intelligence." },
      { id: 6, title: "HAL 9000 Quote", type: "audio", thumbnail: "assets/images/hero.png", duration: "00:08", description: "Famous quote from HAL 9000." },
      { id: 7, title: "Machine Speech", type: "audio", thumbnail: "assets/images/hero.png", duration: "00:12", description: "Things a machine might say." },
      { id: 8, title: "System Voice", type: "audio", thumbnail: "assets/images/hero.png", duration: "00:10", description: "Augmented female system voice." },
      { id: 9, title: "Computer Mouse Sound", type: "audio", thumbnail: "assets/images/hero.png", duration: "00:05", description: "Sound effect of a computer mouse." },
      { id: 10, title: "Fun Python", type: "audio", thumbnail: "assets/images/py.jpg", duration: "45:00", description: "Fun Python programming audio." },
      
      // Images
      { id: 11, title: "Hero Image AVIF", type: "image", thumbnail: "assets/images/hero.avif", duration: null, description: "Hero image in AVIF format." },
      { id: 12, title: "Hero Image PNG", type: "image", thumbnail: "assets/images/hero.png", duration: null, description: "Hero image in PNG format." },
      { id: 13, title: "Hero Image WebP", type: "image", thumbnail: "assets/images/hero.webp", duration: null, description: "Hero image in WebP format." },
      { id: 14, title: "Pavel Danilyuk Photo", type: "image", thumbnail: "assets/images/pexels-pavel-danilyuk-8423045.jpg", duration: null, description: "Photography by Pavel Danilyuk." },
      { id: 15, title: "Unique Digitals Photo", type: "image", thumbnail: "assets/images/pexels-unique-digitals-154779423-10614240.jpg", duration: null, description: "Photography by Unique Digitals." },
      { id: 16, title: "Workman Photo", type: "image", thumbnail: "assets/images/pexels-workman-19344119.jpg", duration: null, description: "Photography by Workman." },
      { id: 17, title: "Python Logo", type: "image", thumbnail: "assets/images/py.jpg", duration: null, description: "Python programming language logo." }
    ];

    // ----------  renderMediaCard ----------
    function renderMediaCard(item) {
      // Determine badge colour based on type
      let badgeClass = '';
      let badgeText = '';
      let actionButton = '';
      
      switch (item.type) {
        case 'video':
          badgeClass = 'badge-video';
          badgeText = '🎥 VIDEO';
          actionButton = `<button class="card-action" data-action="play">▶ Play</button>`;
          break;
        case 'audio':
          badgeClass = 'badge-audio';
          badgeText = '🎵 AUDIO';
          actionButton = `<button class="card-action" data-action="play">🔊 Listen</button>`;
          break;
        case 'image':
          badgeClass = 'badge-image';
          badgeText = '🖼️ IMAGE';
          actionButton = `<button class="card-action" data-action="view">👁️ View</button>`;
          break;
        default:
          badgeClass = 'badge-default';
          badgeText = 'MEDIA';
          actionButton = `<button class="card-action" data-action="open">Open</button>`;
      }

      // Duration display if exists
      const durationHtml = item.duration ? `<span class="card-duration">⏱️ ${item.duration}</span>` : '';

      // Return HTML string 
      return `
        <div class="media-card" data-id="${item.id}" data-title="${item.title.replace(/"/g, '&quot;')}" data-type="${item.type}">
          <img src="${item.thumbnail}" alt="${item.title} thumbnail" class="card-thumbnail" loading="lazy">
          <div class="card-content">
            <h3 class="card-title">${item.title}</h3>
            <div class="card-meta">
              <span class="card-badge ${badgeClass}">${badgeText}</span>
              ${durationHtml}
            </div>
            <p class="card-description">${item.description}</p>
            ${actionButton}
          </div>
        </div>
      `;
    }

    // ---------- RENDER fnctn filters and maps ----------
    function renderGallery(filterText = '') {
      const galleryGrid = document.getElementById('galleryGrid');
      if (!galleryGrid) return;

      // Filter data by title 
      const filtered = mediaLibrary.filter(item =>
        item.title.toLowerCase().includes(filterText.toLowerCase())
      );

      // Generate HTML using map + join
      const cardsHtml = filtered.map(item => renderMediaCard(item)).join('');
      galleryGrid.innerHTML = cardsHtml;
    }

    // ---------- LIVE SEARCH  ----------
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        renderGallery(e.target.value);
      });
    }

    // ---------- EVENT listner ----------
    const galleryContainer = document.getElementById('galleryGrid');
    if (galleryContainer) {
      galleryContainer.addEventListener('click', (e) => {
        // Find closest .media-card (in case button or inner element is clicked)
        const card = e.target.closest('.media-card');
        if (!card) return;

        // Retrieve data from dataset
        const id = card.dataset.id;
        const title = card.dataset.title;
        const type = card.dataset.type;

        // console log
        console.log(`[Event Delegation] Card clicked → ID: ${id}, Title: "${title}", Type: ${type}`);

        //

        // If the clicked element is a button, show additional action
        const actionBtn = e.target.closest('.card-action');
        if (actionBtn) {
          const action = actionBtn.dataset.action;
          console.log(`  Action: ${action} on ${title}`);
          
          // demo message
          alert(`🎬 ${action.toUpperCase()} "${title}" (${type}) – demo mode`);
        }
      });
    }

    // Initial render
    renderGallery();
  </script>
</body>
</html>
