  <main>
    <!-- Custom Audio Player (existing) -->
    <div class="media-player">
      <div class="player-visual">
        <div id="status" class="status-overlay" aria-live="polite"></div>
      </div>
      <div class="control-bar">
        <div class="control-left">
          <button id="play-pause" class="play-btn" type="button" aria-label="Play audio">
            <span id="play-icon">▶</span>
          </button>
        </div>
        <div class="control-center">
          <div class="progress-container">
            <input id="seek-slider" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek through audio" />
            <div class="time-display">
              <span id="current-time">0:00</span> / <span id="duration-time">0:00</span>
            </div>
          </div>
        </div>
        <div class="control-right">
          <button id="rewind" class="control-btn" type="button" aria-label="Rewind 10 seconds">⏪</button>
          <button id="forward" class="control-btn" type="button" aria-label="Forward 10 seconds">⏩</button>
          <button id="mute-toggle" class="control-btn" type="button" aria-label="Mute audio">🔊</button>
          <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Adjust volume" />
        </div>
      </div>
    </div>

    <!-- Hidden native audio element -->
    <audio id="audio" src="assets/audio/fun python.mp3"></audio>

    <!-- ========== WEB AUDIO TONE GENERATOR SECTION ========== -->
    <div class="tone-generator-section">
      <h3>🎵 Web Audio Synthesizer</h3>
      <div class="synth-controls">
        <div class="waveform-selector">
          <label>Waveform:</label>
          <select id="waveformSelect" aria-label="Select waveform type">
            <option value="sine">Sine</option>
            <option value="square">Square</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="triangle">Triangle</option>
          </select>
        </div>
        <div class="note-buttons">
          <button class="note-btn" data-freq="261.63" data-note="C4">C4 (261 Hz)</button>
          <button class="note-btn" data-freq="293.66" data-note="D4">D4 (294 Hz)</button>
          <button class="note-btn" data-freq="329.63" data-note="E4">E4 (330 Hz)</button>
          <button class="note-btn" data-freq="440.00" data-note="A4">A4 (440 Hz)</button>
        </div>
        <p class="synth-info">⚡ Click any note – smooth envelope (attack 10ms, release 600ms) prevents clicks.</p>
      </div>
    </div>
  </main>

  <script>
    // ---------- Existing Audio Player Script (unchanged) ----------
    const audio = document.getElementById('audio');
    const playPauseBtn = document.getElementById('play-pause');
    const playIcon = document.getElementById('play-icon');
    const statusEl = document.getElementById('status');
    const seekSlider = document.getElementById('seek-slider');
    const curTimeEl = document.getElementById('current-time');
    const durTimeEl = document.getElementById('duration-time');
    const volumeSlider = document.getElementById('volume-slider');
    const muteBtn = document.getElementById('mute-toggle');
    const rewindBtn = document.getElementById('rewind');
    const forwardBtn = document.getElementById('forward');

    const statusMsg = {
      loadstart: 'loading…',
      loadeddata: '',
      play: '',
      pause: '',
      waiting: 'buffering…',
      playing: '',
      ended: '',
      error: 'error'
    };

    function fmt_time(seconds) {
      const s = Number.isFinite(seconds) && seconds >= 0 ? seconds : 0;
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function updateStatus(eventType) {
      statusEl.textContent = statusMsg[eventType] || '';
    }

    function updateSeek() {
      if (!audio.duration || Number.isNaN(audio.currentTime)) {
        seekSlider.value = 0;
        curTimeEl.textContent = '0:00';
        durTimeEl.textContent = '0:00';
        return;
      }
      const percent = (audio.currentTime / audio.duration) * 100;
      seekSlider.value = percent;
      curTimeEl.textContent = fmt_time(audio.currentTime);
      durTimeEl.textContent = fmt_time(audio.duration);
    }

    function syncPlayButton() {
      if (audio.ended) {
        playIcon.textContent = '↻';
        playPauseBtn.setAttribute('aria-label', 'Replay audio');
        return;
      }
      if (audio.paused) {
        playIcon.textContent = '▶';
        playPauseBtn.setAttribute('aria-label', 'Play audio');
      } else {
        playIcon.textContent = '❚❚';
        playPauseBtn.setAttribute('aria-label', 'Pause audio');
      }
    }

    function syncMute() {
      muteBtn.textContent = audio.muted ? '🔇' : '🔊';
      muteBtn.setAttribute('aria-label', audio.muted ? 'Unmute audio' : 'Mute audio');
    }

    function syncVolume() {
      audio.volume = Number(volumeSlider.value);
      audio.muted = audio.volume <= 0;
      syncMute();
    }

    function togglePlay() {
      if (audio.paused || audio.ended) {
        audio.play().catch(err => {
          console.error('Play failed', err);
          updateStatus('error');
        });
      } else {
        audio.pause();
      }
    }

    function toggleMute() {
      audio.muted = !audio.muted;
      if (audio.muted) {
        volumeSlider.value = 0;
      } else {
        volumeSlider.value = audio.volume || 0.8;
      }
      syncMute();
    }

    function seekAudio() {
      if (!audio.duration) return;
      const pct = Number(seekSlider.value);
      audio.currentTime = (pct / 100) * audio.duration;
    }

    function rewind10() {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    }

    function forward10() {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
    }

    function handleKeyboard(e) {
      const active = document.activeElement;
      const typing = active && ['INPUT', 'TEXTAREA', 'SELECT'].includes(active.tagName);
      if (typing) return;
      switch (e.code) {
        case 'Space':
          e.preventDefault();
          togglePlay();
          break;
        case 'KeyM':
          e.preventDefault();
          toggleMute();
          break;
        case 'ArrowLeft':
          e.preventDefault();
          rewind10();
          break;
        case 'ArrowRight':
          e.preventDefault();
          forward10();
          break;
      }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    muteBtn.addEventListener('click', toggleMute);
    seekSlider.addEventListener('input', seekAudio);
    volumeSlider.addEventListener('input', syncVolume);
    rewindBtn.addEventListener('click', rewind10);
    forwardBtn.addEventListener('click', forward10);
    document.addEventListener('keydown', handleKeyboard);

    audio.addEventListener('loadstart', () => updateStatus('loadstart'));
    audio.addEventListener('loadeddata', () => { updateStatus('loadeddata'); updateSeek(); syncPlayButton(); });
    audio.addEventListener('play', () => { updateStatus('play'); syncPlayButton(); });
    audio.addEventListener('pause', () => { updateStatus('pause'); syncPlayButton(); });
    audio.addEventListener('waiting', () => updateStatus('waiting'));
    audio.addEventListener('playing', () => updateStatus('playing'));
    audio.addEventListener('ended', () => { updateStatus('ended'); syncPlayButton(); });
    audio.addEventListener('timeupdate', updateSeek);
    audio.addEventListener('durationchange', updateSeek);
    audio.addEventListener('error', () => updateStatus('error'));

    audio.volume = 0.8;
    syncMute();
    syncPlayButton();

    // ---------- WEB AUDIO TONE GENERATOR (Task B3) ----------
    let audioCtx = null;          // lazy initialisation
    let activeOscillator = null;
    let activeGain = null;

    // Helper: create AudioContext on first user interaction
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Stop any currently playing tone (with smooth release)
    function stopCurrentTone() {
      if (activeGain && activeOscillator) {
        const now = audioCtx.currentTime;
        // release envelope: ramp gain to 0 over 600ms (decay/release)
        activeGain.gain.cancelScheduledValues(now);
        activeGain.gain.setValueAtTime(activeGain.gain.value, now);
        activeGain.gain.linearRampToValueAtTime(0, now + 0.6);
        // stop oscillator after release finishes
        activeOscillator.stop(now + 0.6);
        activeOscillator = null;
        activeGain = null;
      }
    }

    // Play a frequency with selected waveform and smooth envelope
    function playTone(frequency) {
      // Ensure AudioContext is created and resumed (lazy, on user interaction)
      const context = getAudioContext();
      if (!context) return;

      // Stop any ongoing tone to avoid overlapping (simple monophonic)
      stopCurrentTone();

      // Create oscillator and gain
      const oscillator = context.createOscillator();
      const gainNode = context.createGain();

      // Get selected waveform from dropdown
      const waveformSelect = document.getElementById('waveformSelect');
      oscillator.type = waveformSelect.value;
      oscillator.frequency.setValueAtTime(frequency, context.currentTime);

      // Connect: oscillator → gain → destination
      oscillator.connect(gainNode);
      gainNode.connect(context.destination);

      // Smooth envelope: attack 10ms (gain 0 → 0.3), then release later
      const now = context.currentTime;
      const attackTime = 0.01;    // 10ms
      const releaseTime = 0.6;     // 600ms decay/release

      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(0, now);
      // Attack: linear ramp to full volume (0.3 to avoid distortion)
      gainNode.gain.linearRampToValueAtTime(0.3, now + attackTime);
      // Schedule release after a short sustain (we will trigger release on button release?
      // But requirement: envelope with attack 10ms and release/decay of at least 600ms.
      // We'll keep note playing for 0.8 seconds then automatically release,
      // OR we can stop on next button press. To demonstrate release clearly,
      // we automatically release after 0.8 seconds (sustain length).
      // But many implementations release when the note ends (on next note or after timeout).
      // For clarity and to satisfy "release of at least 600ms", we schedule a release after 0.8s.
      const sustainEnd = now + 0.8;
      gainNode.gain.setValueAtTime(0.3, sustainEnd);
      gainNode.gain.linearRampToValueAtTime(0, sustainEnd + releaseTime);
      oscillator.stop(sustainEnd + releaseTime);

      // Store references to possibly stop early on next note
      activeOscillator = oscillator;
      activeGain = gainNode;

      oscillator.start();
    }

    // Attach event listeners to all note buttons
    const noteButtons = document.querySelectorAll('.note-btn');
    noteButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const freq = parseFloat(btn.getAttribute('data-freq'));
        if (!isNaN(freq)) {
          playTone(freq);
        }
      });
    });

    // Optional: ensure AudioContext resumes if user clicks waveform selector (still user interaction)
    const waveformSelect = document.getElementById('waveformSelect');
    waveformSelect.addEventListener('click', () => {
      getAudioContext(); // initialises on first click
    });
  </script>
</body>
